appId: dev.cryptoric.agent
productName: CryptoricAgent
copyright: Copyright © 2026 Cryptoric
# Windows ships `cryptoricagent.exe`. electron-builder derives the executable
# name from productName, which would give `CryptoricAgent.exe`; naming it here
# is what makes the file itself lowercase, as specified.
executableName: cryptoricagent
directories:
  buildResources: build
  output: release
icon: build/cryptoric-icon.png
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CryptoricAgent
  # `differentialPackageOptions` was removed from the schema in electron-builder
  # 25; leaving it in makes the whole config fail validation before a single
  # file is written.
  differentialPackage: true
publish:
  provider: github
  # The real destination. `owner`/`repo` here are also what the packaged app's
  # updater reads at runtime to find the release feed, so a placeholder here
  # produces an app that checks a repository that does not exist.
  owner: Itz-Npg
  repo: Cryptoric-Agent
  releaseType: release
  # `latest` is the channel `electron-updater` looks at by default; naming it
  # keeps the built `latest.yml` on the same channel the app reads.
  channel: latest
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/cryptoric-icon.png
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  icon: build/cryptoric-icon.png
  category: Development
  # electron-builder wants an explicit desktop entry name for .deb installs.
  synopsis: Autonomous software engineering agent
npmRebuild: false