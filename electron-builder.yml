appId: dev.cryptoric.agent
productName: CryptoricAgent
copyright: Copyright © 2026 Cryptoric
# Windows ships `cryptoricagent.exe`. electron-builder derives the executable
# name from productName, which would give `CryptoricAgent.exe`; naming it here
# is what makes the file itself lowercase, as specified.
executableName: cryptoricagent
directories:
  buildResources: build
  output: release
icon: build/cryptoric-icon.png
files:
  - out/**/*
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  differentialPackage: true
  differentialPackageOptions:
    ...
publish:
  provider: github
  owner: cryptoric
  repo: cryptoric-agent
  releaseType: release
  channel: latest
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/cryptoric-icon.png
  category: public.app-category.developer-tools
linux:
  target:
    - AppImage
    - deb
  icon: build/cryptoric-icon.png
  category: Development
  # electron-builder wants an explicit desktop entry name for .deb installs.
  synopsis: Autonomous software engineering agent
npmRebuild: false