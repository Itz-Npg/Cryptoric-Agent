# Cryptoric Agent — mobile companion CI
#
# Why this exists separately from the main build: the companion is Swift, and
# Swift cannot be compiled or tested on Linux. GitHub's macOS runners have a
# full Xcode toolchain, so the model and relay-client logic — where the real
# bugs are — get genuinely compiled and unit tested on every push.
#
# What is NOT claimed, and cannot be:
#
#   - Nothing here installs the app on a device or simulator. `swift test`
#     runs the logic; it does not launch a UI.
#   - App Store or TestFlight submission needs a paid Apple Developer Program
#     membership and certificates only the account holder can create. This
#     workflow never touches them.
#   - The SwiftUI views are *typechecked* because they are compiled into the
#     library, but they are never rendered. "Compiles" is not "looks right",
#     and pretending otherwise would be the exact overclaim this project
#     corrects for elsewhere.
#
# What exists: mobile/ios is a Swift package (a library, so its logic is
# unit tested on every push) and mobile/ios-app is the Xcode app target that
# turns that library into an .app. The `ipa` job builds the target on a macOS
# runner with signing disabled and packages the .app as an .ipa, which is the
# same script the release workflow runs on a tag.
#
# There is no Android build here, and no Android project to build. An earlier
# version of this comment pointed at a `mobile-android.yml` that does not
# exist; that was a false claim about a capability, which is the one thing this
# file exists to avoid. Producing an `.apk` needs an AndroidManifest.xml and a
# Gradle build, and neither exists yet.

name: Mobile companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS companion (compile + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        # Pinned in the log so a failure is diagnosable without guessing which
        # Swift version produced it.
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        # `swift build`, not `xcodebuild`: the package has no app target and no
        # signing requirement, so nothing here needs a developer account.
        working-directory: mobile/ios
        run: swift build

      - name: Test
        working-directory: mobile/ios
        # No `--package-path` here on purpose. Passing a relative
        # `--package-path` while `working-directory` is already mobile/ios
        # makes Swift chdir to mobile/ios/mobile/ios and fail with a bare
        # "chdir error", which hides the real problem. One mechanism only.
        run: swift test

      - name: Confirm the tests actually ran
        # A green tick from `swift test` on a package with no test target is
        # indistinguishable from a real pass in the job summary.
        working-directory: mobile/ios
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/swift-test.log
          if ! grep -qE "Executed [0-9]+ tests?" /tmp/swift-test.log; then
            echo "::error::No 'Executed N tests' line — the suite may not have run."
            exit 1
          fi
          COUNT="$(grep -oE "Executed [0-9]+ tests?" /tmp/swift-test.log | tail -1 | grep -oE '[0-9]+')"
          echo "executed=$COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::Only $COUNT tests executed; a partial run must not read as a pass."
            exit 1
          fi

  ipa:
    name: iOS companion (.ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          swift --version
          xcodebuild -version

      # The library still builds and tests on its own, and a library can never
      # become an .app — so this step is what turns the companion into something
      # a phone can install. The assertions live in the script, not here, and
      # the same script runs on a tag, so the push build and the published
      # artifact cannot be different builds of different code.
      - name: Build and package the .ipa
        run: bash scripts/build-ios-ipa.sh

      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/CryptoricCompanion-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  relay:
    name: Relay protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the relay
        # The relay is the other half of the wire contract. If only the Swift
        # side is tested, a field renamed on one side still ships broken.
        run: node --test mobile/relay/test/