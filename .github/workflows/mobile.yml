# Cryptoric Agent — mobile companion CI
#
# Why this exists separately from the main build: the companion is Swift, and
# Swift cannot be compiled or tested on Linux. GitHub's macOS runners have a
# full Xcode toolchain, so the model and relay-client logic — where the real
# bugs are — get genuinely compiled and unit tested on every push.
#
# What is NOT claimed, and cannot be:
#
#   - Nothing here installs the app on a device or simulator. `swift test`
#     runs the logic; it does not launch a UI.
#   - App Store or TestFlight submission needs a paid Apple Developer Program
#     membership and certificates only the account holder can create. This
#     workflow never touches them.
#   - The SwiftUI views are *typechecked* because they are compiled into the
#     library, but they are never rendered. "Compiles" is not "looks right",
#     and pretending otherwise would be the exact overclaim this project
#     corrects for elsewhere.
#
# There is no Android build here, and no Android project to build. An earlier
# version of this comment pointed at a `mobile-android.yml` that does not exist;
# that was a false claim about a capability, which is the one thing this file
# exists to avoid. `mobile/ios` is a Swift package and `mobile/relay` is a Node
# library — eight files in total. Neither is an app target, so neither can
# produce an `.ipa` or an `.apk`.

name: Mobile companion

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios:
    name: iOS companion (compile + test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        # Pinned in the log so a failure is diagnosable without guessing which
        # Swift version produced it.
        run: |
          swift --version
          xcodebuild -version

      - name: Build
        # `swift build`, not `xcodebuild`: the package has no app target and no
        # signing requirement, so nothing here needs a developer account.
        working-directory: mobile/ios
        run: swift build

      - name: Test
        working-directory: mobile/ios
        # No `--package-path` here on purpose. Passing a relative
        # `--package-path` while `working-directory` is already mobile/ios
        # makes Swift chdir to mobile/ios/mobile/ios and fail with a bare
        # "chdir error", which hides the real problem. One mechanism only.
        run: swift test

      - name: Confirm the tests actually ran
        # A green tick from `swift test` on a package with no test target is
        # indistinguishable from a real pass in the job summary.
        working-directory: mobile/ios
        run: |
          set -o pipefail
          swift test 2>&1 | tee /tmp/swift-test.log
          if ! grep -qE "Executed [0-9]+ tests?" /tmp/swift-test.log; then
            echo "::error::No 'Executed N tests' line — the suite may not have run."
            exit 1
          fi
          COUNT="$(grep -oE "Executed [0-9]+ tests?" /tmp/swift-test.log | tail -1 | grep -oE '[0-9]+')"
          echo "executed=$COUNT"
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::Only $COUNT tests executed; a partial run must not read as a pass."
            exit 1
          fi

  ipa:
    name: iOS companion (.ipa)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show the toolchain
        run: |
          swift --version
          xcodebuild -version

      # The library still builds and tests on its own, but a library cannot
      # become an .app. This job is the first thing in this repository that
      # produces something a phone can install, so it is also the first thing
      # that can fail for a reason nobody was watching for.
      - name: Build the app target (unsigned, device SDK)
        run: |
          set -o pipefail
          xcodebuild \
            -project mobile/ios-app/CryptoricCompanion.xcodeproj \
            -target CryptoricCompanion \
            -sdk iphoneos \
            -configuration Release \
            SYMROOT="$RUNNER_TEMP/products" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # `xcodebuild` exiting 0 is not proof of a bundle. The check below is the
      # same shape as the Swift test count assertion above: verify the artifact
      # itself, so a build that quietly produced nothing cannot read as green.
      - name: Confirm an .app bundle really exists
        run: |
          set -o pipefail
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/xcodebuild.log"; then
            echo "::error::xcodebuild never reported BUILD SUCCEEDED."
            tail -40 "$RUNNER_TEMP/xcodebuild.log"
            exit 1
          fi
          APP="$(find "$RUNNER_TEMP/products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$APP" ]; then
            echo "::error::No .app in Release-iphoneos. A library cannot produce one."
            ls -la "$RUNNER_TEMP/products" || true
            exit 1
          fi
          echo "app=$APP"
          ls -la "$APP"

      # An .ipa is a zip with the .app at its root — the layout Sideloadly,
      # AltStore and SideStore expect. (App Store submissions use a Payload/
      # wrapper instead; that is a different file for a different purpose, and
      # building the wrong one would produce an .ipa that no sideloading tool
      # can read.)
      - name: Package the .ipa
        run: |
          set -o pipefail
          mkdir -p dist
          APP="$(find "$RUNNER_TEMP/products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)"
          ( cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/dist/CryptoricCompanion-unsigned.ipa" "$(basename "$APP")" )
          ls -la dist/
          SIZE=$(wc -c < dist/CryptoricCompanion-unsigned.ipa)
          echo "ipa_bytes=$SIZE"
          if [ "$SIZE" -lt 100000 ]; then
            echo "::error::The .ipa is $SIZE bytes. That is not a bundle."
            exit 1
          fi
          unzip -l dist/CryptoricCompanion-unsigned.ipa | head -20
          if ! unzip -l dist/CryptoricCompanion-unsigned.ipa | grep -q "CryptoricCompanion.app/Info.plist"; then
            echo "::error::No CryptoricCompanion.app/Info.plist at the archive root."
            exit 1
          fi
          # The binary the library was linked into, so a build that shipped only
          # resources cannot pass.
          if ! unzip -l dist/CryptoricCompanion-unsigned.ipa | grep -q "CryptoricCompanion.app/CryptoricCompanion$"; then
            echo "::error::The .ipa contains no CryptoricCompanion executable."
            exit 1
          fi

      # Unsigned on purpose. Producing an .ipa needs no Apple account; only
      # installing it on a device does, or a re-signing tool. Claiming otherwise
      # would put an Apple requirement on a step that does not have one.
      - name: Upload the .ipa
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: dist/CryptoricCompanion-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  relay:
    name: Relay protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test the relay
        # The relay is the other half of the wire contract. If only the Swift
        # side is tested, a field renamed on one side still ships broken.
        run: node --test mobile/relay/test/