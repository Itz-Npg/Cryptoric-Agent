# Cryptoric Agent — build and release.
#
# Why this exists: Windows builds were produced on a developer's Windows machine
# and nothing else was ever packaged. `electron-builder.yml` already declares
# `mac` and `linux` targets, but those can only actually be produced by a runner
# on that operating system — electron-builder cannot cross-compile a macOS `.dmg`
# from Windows. So without this workflow the macOS and Linux entries in the
# builder config are declarations, not deliverables.
#
# What it does:
#   1. `verify`  — typecheck and unit tests on every push and PR. Cheap, and it
#      catches the class of breakage that otherwise only appears after a 5-minute
#      package step.
#   2. `build`   — packages the app for Windows, macOS and Linux. Runs on every
#      push; uploads artifacts. Publishes nothing.
#   3. `release` — on a `v*` tag, collects the artifacts from all three runners
#      and attaches them to one GitHub Release.
#
# Honesty notes, because an unsigned build that behaves differently per platform
# is worse than one that is not built at all:
#   - Nothing here is signed. Windows SmartScreen will warn; macOS Gatekeeper will
#     refuse to open a downloaded `.dmg` until the user clears it. There are no
#     signing certificates in this repository, and none are invented.
#   - The macOS `.app` is built for both `x64` and `arm64` on an Apple Silicon
#     runner. That is a real cross-arch build, not an emulation claim.
#   - A tag build only publishes if `package.json` version matches the tag. A
#     mismatch would publish v0.1.4-tagged artifacts containing 0.1.3, which is
#     exactly the kind of silent version drift that makes an installed build
#     report the wrong thing about itself.

name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile, so
      # a build cannot quietly succeed against versions nobody committed.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

  # The integrated browser is the largest single subsystem in this project
  # (43 tools, ~5,600 lines) and until now its only proof lived on whoever's
  # desktop happened to run `npm run test:browser`. A subsystem that large
  # cannot be verified by one developer pressing one command.
  #
  # It has to run under a real Electron main process against real Chromium:
  # `WebContentsView`, the DevTools protocol and the permission handlers simply
  # do not exist under vitest, so there is no honest way to move this into the
  # Node-based `verify` job. xvfb supplies the display the runner lacks.
  browser:
    name: Live browser check (real Chromium)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium's runtime libraries, and xvfb for the display. Without these the
      # Electron binary cannot start and the failure is an unhelpful shared-object
      # error rather than a test result.
      - name: Install Chromium and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            xvfb \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libgbm1 \
            libgtk-3-0 \
            libnspr4 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libasound2t64 \
            libpango-1.0-0 \
            libcairo2

      # Electron's setuid sandbox needs privileges a GitHub runner does not
      # grant. Disabling it is safe here and only here: this job runs a
      # first-party test against a local fixture server, not untrusted content.
      - name: Live browser check
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
          # Under xvfb there is no GPU and no compositor. Without software
          # rendering, `capturePage` times out and synthesised pointer events
          # never reach the page — which fails click, drag, screenshot and link
          # navigation while everything read-only keeps passing.
          CRYPTORIC_CHECK_CHROMIUM_FLAGS: >-
            --disable-gpu
            --disable-gpu-sandbox
            --in-process-gpu
            --use-gl=swiftshader
            --disable-dev-shm-usage
          # Software rendering is several times slower than a desktop GPU.
          CRYPTORIC_CHECK_WATCHDOG_MS: '600000'
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
            npm run test:browser 2>&1 | tee browser-check.log

      # The harness exits 1 on any failure, and `pipefail` above propagates that
      # through `tee`. The count is asserted as well, because a run that crashed
      # before its first assertion would otherwise be indistinguishable from a
      # pass in the job summary.
      - name: Assert the browser suite actually ran its assertions
        run: |
          SUMMARY="$(grep -oE '^[0-9]+/[0-9]+ checks passed' browser-check.log | tail -1)"
          if [ -z "$SUMMARY" ]; then
            echo "::error::No 'N/M checks passed' line in the browser check output."
            tail -40 browser-check.log
            exit 1
          fi
          PASSED="${SUMMARY%%/*}"
          TOTAL="${SUMMARY##*/}"
          TOTAL="${TOTAL%% *}"
          echo "browser checks: $PASSED/$TOTAL"
          if [ "$PASSED" != "$TOTAL" ]; then
            echo "::error::$((TOTAL - PASSED)) browser check(s) failed."
            grep -E '^\[FAIL\]' browser-check.log || true
            exit 1
          fi
          if [ "$TOTAL" -lt 40 ]; then
            echo "::error::Only $TOTAL browser checks ran; the suite has more than that."
            echo "A partial run must not be reported as a passing one."
            exit 1
          fi

  build:
    name: Package ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not hide the state of the others, and a
      # partially published release is worse than a visibly failed one.
      fail-fast: false
      matrix:
        include:
          - name: Windows (NSIS, x64)
            os: windows-latest
          - name: macOS (dmg, x64 + arm64)
            os: macos-latest
          - name: Linux (AppImage + deb)
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron-builder packages whatever `npm run build` produced. Running the
      # typecheck inside it means a release tag cannot ship a type error that the
      # `verify` job would have caught — the jobs are independent checkouts.
      - name: Build
        run: npm run build

      # electron-builder needs these to assemble AppImage/deb on a bare runner.
      - name: Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libarchive-tools \
            libfuse2 \
            desktop-file-utils \
            rpm

      # With no signing certificate present, electron-builder's automatic
      # identity discovery can sit and wait for a human on a headless runner.
      # Saying so explicitly is honest: these builds are unsigned.
      - name: Package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No certificate is configured; do not pretend to look for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never

      - name: List what was produced
        # `shell: bash` is load-bearing. The default shell on a Windows runner is
        # PowerShell, where `ls -la` is not a command — the packaging step
        # itself succeeded and this diagnostic step killed the job with
        # "A parameter cannot be found that matches parameter name 'la'".
        shell: bash
        run: |
          echo "=== release/ contents ==="
          ls -la release/ || true
          echo
          echo "=== package.json version ==="
          node -p "require('./package.json').version"

      # The unpacked app directory is what `mac` produces alongside the `.dmg`,
      # and the Linux unpacked tree is just as large. Neither is a deliverable.
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  # Sign the collected artifacts and publish them alongside.
  #
  # Signing lives in its own job rather than inside `build` because the three
  # runners each produce artifacts for a *different* operating system, and a
  # detached OpenPGP signature is not platform-specific: one Linux runner can
  # sign the Windows `.exe`, the macOS `.dmg` and the Linux `.deb` alike. One
  # signing run, one key, one place in the log to look when a signature is
  # disputed.
  sign:
    name: Sign artifacts
    needs: build
    # Publishing is outward-facing, so signing stays with the same tag-only
    # trigger as the release itself. A push to main still produces unsigned
    # artifacts as build output, which is fine — they are not distributed.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ubuntu-latest ships gpg, but pinning the major version means a runner
      # image change cannot silently swap in a build that parses --status-fd
      # output differently.
      - name: Install gpg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnupg
          gpg --version

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List collected artifacts
        run: ls -la artifacts/

      # Deliberately `::error::` + exit rather than a conditional skip. A job
      # that quietly skips when a secret is missing produces an unsigned release
      # that looks signed in the logs, and nobody notices until a user does.
      - name: Require the release signing key
        env:
          HAS_KEY: ${{ secrets.CRYPTORIC_GPG_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::Repository secret CRYPTORIC_GPG_KEY is not set."
            echo "Add the armored private key as a repository secret, or this"
            echo "release will not be signed. See docs/signing/SIGNING.md."
            exit 1
          fi

      - name: Sign
        env:
          CRYPTORIC_GPG_KEY: ${{ secrets.CRYPTORIC_GPG_KEY }}
          CRYPTORIC_GPG_PASSPHRASE: ${{ secrets.CRYPTORIC_GPG_PASSPHRASE }}
          # Pinning the fingerprint means a swapped secret is caught rather than
          # used: signing with whatever key happens to be configured is exactly
          # the failure this repository is trying to make detectable.
          CRYPTORIC_GPG_FINGERPRINT: '0A0BDF9C7A1C544D22505E4BC91B55788C7458A1'
          CRYPTORIC_SIGN_DIR: artifacts
        run: npm run sign:release

      # Signatures are only worth anything if they verify. This re-verifies each
      # `.asc` against the committed public key before anything is published, so
      # a signing bug fails the release instead of shipping to users.
      - name: Verify every signature before publishing
        env:
          CRYPTORIC_GPG_PASSPHRASE: ${{ secrets.CRYPTORIC_GPG_PASSPHRASE }}
        run: |
          status=0
          for sig in artifacts/*.asc; do
            [ -e "$sig" ] || continue
            artifact="${sig%.asc}"
            if ! node scripts/verify-release.mjs "$artifact"; then
              echo "::error::Signature does not verify: $sig"
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "::error::Refusing to publish artifacts whose signatures do not verify."
            exit 1
          fi
          echo "All signatures verify."

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed
          if-no-files-found: error
          retention-days: 14
          path: artifacts/*

  release:
    name: Publish GitHub Release
    needs: [build, sign]
    # Publishing is destructive and outward-facing: only ever on an explicit
    # version tag, never on an ordinary push to main.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The updater reads `latest.yml` and compares it against the running build,
      # so a tag whose version disagrees with package.json produces a release the
      # app cannot reason about. Fail loudly instead.
      - name: Verify the tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG."
            echo "Bump package.json to $TAG before tagging, or the release will lie."
            exit 1
          fi

      # Only the `signed` artifact, and only by name. The earlier version used
      # `merge-multiple: true` with no `name`, which now also pulls in the
      # per-platform `installers-*` artifacts that `sign` already consumed —
      # publishing the same installer twice and letting whichever copy landed
      # last decide whether it was the signed one.
      - uses: actions/download-artifact@v4
        with:
          name: signed
          path: artifacts

      - name: List collected artifacts
        run: ls -la artifacts/

      # Uses the `gh` CLI that ships with the runner rather than a third-party
      # action, so the publishing path adds no new dependency to trust.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          NOTES=$(mktemp)
          {
            echo "These builds are GPG-signed. Every installer has a matching"
            echo "\`.asc\` detached signature, verifiable with:"
            echo
            echo "\`\`\`"
            echo "npm run verify:release -- <downloaded-file>"
            echo "\`\`\`"
            echo
            echo "The public key is committed at docs/signing/cryptoric-agent-signing-key.asc."
            echo
            echo "This is not an Authenticode or Apple signature: Windows SmartScreen"
            echo "and macOS Gatekeeper will still warn. See docs/signing/SIGNING.md."
            echo
            echo "### Installers"
            for f in artifacts/*.exe artifacts/*.dmg artifacts/*.AppImage artifacts/*.deb; do
              [ -e "$f" ] || continue
              echo "- ${f#artifacts/}"
            done
          } > "$NOTES"

          # Replace the release if it exists, so re-running a tag fixes a partial
          # publish instead of failing on "already_exists".
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" artifacts/* \
              --title "$TAG" \
              --notes-file "$NOTES" \
              --latest
          fi

      - name: Verify the published feed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # `latest.yml` is the file `electron-updater` actually downloads. If it
          # is missing or does not name this version, the app has nothing to read
          # and the release is not usable however many installers it has.
          #
          # The `v` is stripped by the shell, not by the expression language.
          # Actions has no `#` operator, so trying to trim the prefix inside an
          # expression makes GitHub reject the entire workflow file before a
          # single job starts. The example is written without braces on purpose:
          # expressions are interpolated across the whole `run` string, comments
          # included, so even a comment that merely *looks* like one gets parsed.
          VERSION="${TAG#v}"
          echo "=== release assets ==="
          gh release view "$TAG" --json assets --jq '.assets[].name'
          echoecho "=== latest.yml ==="
            gh release download "$TAG" --pattern latest.yml --dir /tmp/feed --clobber
            cat /tmp/feed/latest.yml
            if ! grep -q "^version: ${VERSION}$" /tmp/feed/latest.yml; then
              echo "::error::latest.yml does not declare version ${VERSION}."
              exit 1
            fi
            echo "latest.yml declares ${VERSION} — the updater has a feed to read."

      # A release whose signatures did not make it onto the GitHub Release is not
      # a signed release, however green the signing job was. Counting is the only
      # check that catches a `.asc` that signed locally and was never uploaded.
      - name: Verify the published release carries its signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          assets="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          installers=0
          signatures=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            case "$name" in
              *.exe|*.dmg|*.deb|*.AppImage|*.zip|*.rpm)
                installers=$((installers + 1))
                ;;
              *.asc)
                signatures=$((signatures + 1))
                ;;
            esac
          done <<< "$assets"
          echo "installers=$installers signatures=$signatures"
          if [ "$installers" -eq 0 ]; then
            echo "::error::No installers on the release at all."
            exit 1
          fi
          if [ "$signatures" -ne "$installers" ]; then
            echo "::error::$installers installer(s) but $signatures signature(s)."
            echo "Publishing a partially signed release is worse than publishing"
            echo "an unsigned one, because it looks signed."
            exit 1
          fi
          echo "every installer on the release has a signature."