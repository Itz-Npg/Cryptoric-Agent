<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Cryptoric CLI">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10140d"/>
      <stop offset="1" stop-color="#070905"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8fa5f"/>
      <stop offset="1" stop-color="#9fe838"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3c4530"/>
      <stop offset="1" stop-color="#1c2116"/>
    </linearGradient>
  </defs>

  <!-- plate -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#2a331f" stroke-width="2"/>

  <!-- terminal window -->
  <rect x="18" y="26" width="92" height="76" rx="12" fill="#0c0f09" stroke="#39441f" stroke-width="2"/>
  <rect x="18" y="26" width="92" height="18" rx="12" fill="url(#title)"/>
  <rect x="18" y="36" width="92" height="8" fill="url(#title)"/>
  <circle cx="32" cy="35" r="3.2" fill="#5a6a3a"/>
  <circle cx="43" cy="35" r="3.2" fill="#47552e"/>
  <circle cx="54" cy="35" r="3.2" fill="#39441f"/>

  <!-- prompt: chevron + block caret -->
  <path d="M34 60 L46 70 L34 80" fill="none" stroke="url(#lime)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="54" y="58" width="9" height="24" rx="2" fill="url(#lime)"/>
  <rect x="70" y="70" width="26" height="6" rx="3" fill="#2f3a1e"/>

  <!-- ghost C: the wordmark's first letter, offset like the brand shadow -->
  <text x="64" y="122" text-anchor="middle" font-family="'JetBrains Mono','Cascadia Mono',Consolas,monospace"
        font-size="13" font-weight="700" letter-spacing="4" fill="#55663a">CRYPTORIC</text>
</svg>
